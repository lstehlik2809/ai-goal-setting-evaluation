[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "goal-setting-evaluation"
version = "0.1.0"
description = "Local descriptive evaluation of recorded employee goals"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = ["pandas>=2.2,<3", "numpy>=2,<3", "pyarrow>=16,<24", "PyYAML>=6,<7", "langid==1.1.6", "cmudict==1.1.3"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "build>=1,<2"]

[project.scripts]
goal-eval = "goal_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
goal_eval = ["resources/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
